[project]
name = "lucero-backend"
version = "0.1.0"
description = "ADK backend for Lucero"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6.1",
    "pymongo>=4.7.0",
    "python-dotenv>=1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
