[project]
name = "lucero-backend"
version = "0.1.0"
description = "ADK backend for Lucero"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.6.1",
    "pymongo>=4.7.0",
    "python-dotenv>=1.0.1",
    "google-adk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "mcp>=1.27.1",
    "voyageai>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
